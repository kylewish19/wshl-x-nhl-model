[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wshlx-nhl-model"
version = "0.1.0"
description = "WSHL_X NHL probability, price-gating, and grading framework"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
