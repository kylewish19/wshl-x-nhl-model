name: Unified Daily NHL Shadows
on:
  push:
    paths:
      - '.github/workflows/daily-shadows.yml'
  workflow_run:
    workflows: ['Reusable Official NHL Core Slate']
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'live paper comparison or retrospective smoke test'
        type: choice
        options: [live, replay]
        required: true
        default: live
      target_date:
        description: 'Eastern slate date'
        type: string
        required: true
      core_run_id:
        description: 'Successful frozen official core workflow run ID'
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve research request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN: ${{ inputs.core_run_id }}
          DISPATCH_DATE: ${{ inputs.target_date }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os,re,json,subprocess
          event=os.environ['EVENT']
          if event=='workflow_run':
              run=os.environ['SOURCE']
              a=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}/artifacts"]))['artifacts']
              live=[x for x in a if re.fullmatch(r'nhl-core-slate-\d{4}-\d{2}-\d{2}',x['name']) and not x['expired']]
              if not live:
                  with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('skip=true\n')
                  print('No live core artifact; skip research follow-up')
                  raise SystemExit(0)
              assert len(live)==1
              date=live[0]['name'].removeprefix('nhl-core-slate-');mode='live'
          else:
              run=os.environ['DISPATCH_RUN'] or '43313573453';date=os.environ['DISPATCH_DATE'] or '2026-11-12';mode=os.environ['DISPATCH_MODE'] or 'replay'
          assert re.fullmatch(r'\d+',run) and re.fullmatch(r'\d{4}-\d{2}-\d{2}',date) and mode in ('live','replay')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'skip=false\nrun={run}\ndate={date}\nmode={mode}\n')
          PY
      - run: pip install -r requirements.txt && pip install -e .
        if: steps.request.outputs.skip == 'false'
      - run: pytest -q
        if: steps.request.outputs.skip == 'false'
      - name: Validate source core run and artifact
        if: steps.request.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.request.outputs.run }}
          TARGET: ${{ steps.request.outputs.date }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TARGET" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > core_run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" > core_artifacts.json
          python - <<'PY'
          import json,os,re
          r=json.load(open("core_run.json"))
          assert r["conclusion"]=="success" and r["head_branch"]=="main"
          assert re.fullmatch(r"\.github/workflows/(?:\d{4}-\d{2}-\d{2}-core-slate|core-slate)\.yml",r["path"])
          a=[x for x in json.load(open("core_artifacts.json"))["artifacts"] if x["name"]=="nhl-core-slate-"+os.environ["TARGET"] and not x["expired"]]
          assert len(a)==1 and a[0]["workflow_run"]["id"]==r["id"]
          json.dump(a[0],open("core_artifact.json","w"))
          PY
      - uses: actions/download-artifact@v4
        if: steps.request.outputs.skip == 'false'
        with:
          name: nhl-core-slate-${{ steps.request.outputs.date }}
          run-id: ${{ steps.request.outputs.run }}
          github-token: ${{ github.token }}
          path: data/research/unified_core_input
      - uses: actions/download-artifact@v4
        if: steps.request.outputs.skip == 'false'
        with:
          name: atg-game-shadow-2026-11-25
          run-id: 45713698148
          github-token: ${{ github.token }}
          path: data/research/atg_archive_input
      - uses: actions/download-artifact@v4
        if: steps.request.outputs.skip == 'false'
        with:
          name: atg-archive-audit-2026-11-25
          run-id: 45714769216
          github-token: ${{ github.token }}
          path: data/research/atg_frozen_bundle
      - uses: actions/download-artifact@v4
        if: steps.request.outputs.skip == 'false'
        with:
          name: nhl-resume-refresh-2026-11-24
          run-id: 45713367700
          github-token: ${{ github.token }}
          path: data/research/margin_history
      - uses: actions/download-artifact@v4
        if: steps.request.outputs.skip == 'false'
        with:
          name: team-market-shadow-2026-11-25
          run-id: 45716648252
          github-token: ${{ github.token }}
          path: data/research/margin_bundle
      - name: Build unified paper comparison
        if: steps.request.outputs.skip == 'false'
        env:
          MODE: ${{ steps.request.outputs.mode }}
          TARGET: ${{ steps.request.outputs.date }}
        run: |
          FLAGS=()
          if [ "$MODE" = replay ]; then FLAGS+=(--replay); fi
          HISTORY=$(find data/research/margin_history -name "2026-11-24_team_games.parquet" -print -quit)
          BUNDLE=$(find data/research/margin_bundle -name "models.joblib" -print -quit)
          test -f "$HISTORY" && test -f "$BUNDLE"
          python scripts/run_daily_shadow.py --target-date "$TARGET" --core-dir data/research/unified_core_input --source-metadata core_artifact.json --history data/research/atg_archive_input/skater_games.parquet --bundle data/research/atg_frozen_bundle/atg_game_shadow.joblib --team-history "$HISTORY" --margin-bundle "$BUNDLE" --out data/research/unified_shadow_output "${FLAGS[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.request.outputs.skip == 'false'
        with:
          name: unified-daily-shadows-${{ steps.request.outputs.date }}
          path: data/research/unified_shadow_output/
          retention-days: 90
          if-no-files-found: error
