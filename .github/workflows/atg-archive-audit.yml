name: ATG Archived Data Audit
on:
  push:
    paths:
      - '.github/workflows/atg-archive-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -q
      - name: Retrieve immutable failed-run input
        uses: actions/download-artifact@v4
        with:
          name: atg-game-shadow-2026-11-25
          run-id: 45713698148
          github-token: ${{ github.token }}
          path: data/research/atg_archive_input
      - name: Audit counts and run gated sensitivity benchmark
        run: python scripts/audit_atg_archive.py --raw data/research/atg_archive_input/skater_games.parquet --out-dir data/research/atg_archive_audit_2026-11-25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atg-archive-audit-2026-11-25
          path: data/research/atg_archive_audit_2026-11-25/
          retention-days: 90
