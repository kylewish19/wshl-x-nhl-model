name: ATG Advanced Source Audit
on:
  push:
    paths:
      - '.github/workflows/atg-advanced-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt && pip install -e .
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: atg-game-shadow-2026-11-25
          run-id: 45713698148
          github-token: ${{ github.token }}
          path: data/research/atg_archive_input
      - name: Sample every historical season
        run: python scripts/probe_atg_advanced_sources.py --history data/research/atg_archive_input/skater_games.parquet --out-dir data/research/atg_advanced_source_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atg-advanced-source-audit
          path: data/research/atg_advanced_source_audit/
          retention-days: 90
