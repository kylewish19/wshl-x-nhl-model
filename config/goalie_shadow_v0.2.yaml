# Shadow-only goalie save model configuration.
# This does not replace the official v0.1.0 goalie model until promotion criteria are met.
# Features in this revision are built entirely from NHL regular-season boxscores so the
# pipeline is reproducible without relying on an unavailable private feature table.

workload:
  target: shots_against
  categorical:
    - team
    - opponent
  numeric:
    - is_home
    - days_rest
    - starts_last_7d
    - team_shots_against_r5
    - team_shots_against_r10
    - opponent_shots_for_r5
    - opponent_shots_for_r10
    - opponent_goals_for_r5
    - team_goals_against_r5

save_rate:
  target: saves
  shots_target: shots_against
  categorical:
    - goalie_id
    - team
    - opponent
  numeric:
    - is_home
    - days_rest
    - starts_last_7d
    - save_pct_r5
    - save_pct_r10
    - goalie_shots_against_r5
    - goalie_shots_against_r10

promotion:
  minimum_clean_listed_props: 20
  require_better_saves_mae: true
  require_better_probability_calibration: true
  notes: >-
    Historical chronological validation is necessary but not sufficient. The shadow
    must also beat v0.1.0 prospectively on FanDuel-listed goalie-save props before promotion.
    Under the Oct. 5 policy, a FanDuel goalie listing is sufficient for candidate eligibility;
    a non-start that the sportsbook voids is graded VOID.
